name: clearplate-server
services:
  clearplate:
    build:
      context: ../..
      dockerfile: deploy/server/Dockerfile
    image: clearplate-server:1.3.0
    restart: unless-stopped
    user: "${CLEARPLATE_UID:?Run init.sh first}:${CLEARPLATE_GID:?Run init.sh first}"
    init: true
    ports:
      - "127.0.0.1:${CLEARPLATE_PORT:-8787}:8080"
    environment:
      CLEARPLATE_PUBLIC_ORIGIN: "${CLEARPLATE_PUBLIC_ORIGIN:-http://localhost:8787}"
      CLEARPLATE_DATA_DIR: /data
      CLEARPLATE_KEY_FILE: /run/secrets/session_key
      CLEARPLATE_PASSWORD_FILE: /run/secrets/admin_password
      CLEARPLATE_HTTP_TIMEOUT: "${CLEARPLATE_HTTP_TIMEOUT:-90}"
    secrets:
      - session_key
      - admin_password
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 128
    stop_grace_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
secrets:
  session_key:
    file: ./.secrets/session_key
  admin_password:
    file: ./.secrets/admin_password
